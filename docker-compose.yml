name: b3-portfolio-tracker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b3pt
      POSTGRES_USER: b3pt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b3pt -d b3pt']
      interval: 5s
      timeout: 3s
      retries: 10
    # Sem porta publicada: só a rede interna do compose acessa o banco.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgres://b3pt:${POSTGRES_PASSWORD}@postgres:5432/b3pt
      API_KEY: ${API_KEY:?defina API_KEY (32+ caracteres) no .env}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

  analytics:
    build: services/analytics
    environment:
      CORS_ORIGIN: http://localhost:8080
    ports:
      - '127.0.0.1:8000:8000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
