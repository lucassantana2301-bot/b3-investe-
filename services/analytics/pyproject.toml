[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "b3pt-analytics"
version = "1.0.0"
description = "Métricas de risco (volatilidade, Sharpe, Sortino, drawdown, beta, VaR) para o b3-portfolio-tracker"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "numpy>=1.26",
  "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
