name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, types, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: b3pt_test
          POSTGRES_USER: b3pt
          POSTGRES_PASSWORD: b3pt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U b3pt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -w @b3pt/core
      - run: npm run typecheck
      - run: npm test
      - name: Testes de integração (Postgres)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://b3pt:b3pt@localhost:5432/b3pt_test
      - run: npm run build

  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/analytics/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [typescript, python]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t b3pt-api .
      - run: docker build -f apps/web/Dockerfile -t b3pt-web .
      - run: docker build -t b3pt-analytics services/analytics
